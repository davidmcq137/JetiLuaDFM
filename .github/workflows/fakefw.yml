name: FakeFW tests
# Runs the FakeFW acceptance tests (FakeFW/test/run-tests.sh): GpsTest
# against measured emulator and TX outputs, and the DFM-TimG UIDriver
# scripts. Separate from main.yml so the release build isn't affected.
on:
  push:
    branches: [dev, master, beta]
  pull_request:
jobs:
  fakefw:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo as Emulator/Apps
        uses: actions/checkout@v4
        with:
          path: Emulator/Apps
      - name: Checkout lua_jeti repo
        uses: actions/checkout@v4
        with:
          repository: fazzone/lua_jeti
          path: lua_jeti
      - name: apt deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libreadline-dev
      - name: Build the JETI-like Lua with type() names fixed, and fakefw_c.so
        run: |
          set -ex
          cd lua_jeti
          patch -p1 < ../Emulator/Apps/FakeFW/test/ltm-typefix.patch
          make -j4 linux
          cd ..
          Emulator/Apps/FakeFW/build.sh "$GITHUB_WORKSPACE/lua_jeti/src"
      - name: Run FakeFW tests
        run: |
          cd Emulator
          Apps/FakeFW/test/run-tests.sh "$GITHUB_WORKSPACE/lua_jeti/src/lua"
