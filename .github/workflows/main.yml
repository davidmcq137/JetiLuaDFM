name: CI
on:
  push:
    branches: [master, beta]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v2
      - name: Checkout lua_jeti repo
        uses: actions/checkout@v2
        with:
          repository: fazzone/lua_jeti
          path: lua_jeti
      - name: apt deps
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y jq sox libreadline-dev          
      - name: install heroku cli
        shell: bash
        run: |
          sudo curl https://cli-assets.heroku.com/install-ubuntu.sh | sh
      - name: Build lua itself
        shell: bash
        run: |
          set -ex
          cd lua_jeti
          make -j4 linux
      - name: Build Lua apps
        id: lc_build
        shell: bash
        run: |
          set -ex
          lua_jeti/src/lua build/script.lua
      - name: Install bb
        shell: bash
        run: |
          set -e
          curl -L -o bb.tar.gz "https://github.com/babashka/babashka/releases/download/v1.12.218/babashka-1.12.218-linux-amd64.tar.gz"
          tar -xvzf bb.tar.gz
          chmod +x bb
      - name: npm deps
        shell: bash
        run: |
          npm ci
      - name: Build server jar
        shell: bash
        run: |
          cat >common-resources/common/banner.txt <<EOF
          Build for $GITHUB_REF_NAME @ $GITHUB_SHA
          $(date -Iseconds)
          EOF
          echo '================================================================'
          cat common-resources/common/banner.txt
          echo '================================================================'
          ./bb clojure -M -e '(user/build-uberjar-and-exit "dist.jar")'
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-jar
          path: dist.jar
      - name: Set up heroku credentials
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_EMAIL: ${{ secrets.HEROKU_EMAIL }}
        run: |
          cat > ~/.netrc <<EOF
            machine api.heroku.com
              login $HEROKU_EMAIL
              password $HEROKU_API_KEY
            machine git.heroku.com
              login $HEROKU_EMAIL
              password $HEROKU_API_KEY
          EOF
      - name: install heroku jvm deployer
        shell: bash
        run: |
	  # .
          curl -L -o jvm-deployer.jar "https://github.com/heroku/heroku-jvm-application-deployer/releases/download/v4.0.13/heroku-jvm-application-deployer-4.0.13.jar"
      - name: Heroku deploy
        shell: bash
        run: |
          java -jar jvm-deployer.jar --app=jetiluastaging dist.jar


          

