name: CI
# One job: build the JETI-like Lua, run the TestMitter tests, and only on beta
# and master build the apps and the server jar and deploy to Heroku staging.
# A failing test stops the job before anything is deployed, so staging keeps
# the last good build. Pushes to dev and pull requests run only the tests.
on:
  push:
    branches: [dev, master, beta]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DEPLOY: ${{ github.event_name == 'push' && (github.ref_name == 'beta' || github.ref_name == 'master') }}
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
      - name: Checkout lua_jeti repo
        uses: actions/checkout@v4
        with:
          # Russell's fazzone/lua_jeti with the type() names fix in ltm.c
          # (his OK, 2026-11-22)
          repository: davidmcq137/lua_jeti
          path: lua_jeti
      - name: apt deps
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y jq sox libreadline-dev
      - name: Build lua itself, and testmx_c.so
        shell: bash
        run: |
          set -ex
          cd lua_jeti
          make -j4 linux
          cd ..
          TestMX/build.sh "$GITHUB_WORKSPACE/lua_jeti/src"
      - name: TestMitter tests
        shell: bash
        run: |
          # the tests run from an Emulator folder with the apps in Apps
          mkdir -p "$RUNNER_TEMP/Emulator"
          ln -s "$GITHUB_WORKSPACE" "$RUNNER_TEMP/Emulator/Apps"
          cd "$RUNNER_TEMP/Emulator"
          Apps/TestMX/test/run-tests.sh "$GITHUB_WORKSPACE/lua_jeti/src/lua"

      # ---- release build and deploy: beta and master only ----
      - name: install heroku cli
        if: env.DEPLOY == 'true'
        shell: bash
        run: |
          sudo curl https://cli-assets.heroku.com/install-ubuntu.sh | sh
      - name: Build Lua apps
        if: env.DEPLOY == 'true'
        id: lc_build
        shell: bash
        run: |
          set -ex
          lua_jeti/src/lua build/script.lua
      - name: Install bb
        if: env.DEPLOY == 'true'
        shell: bash
        run: |
          set -e
          curl -L -o bb.tar.gz "https://github.com/babashka/babashka/releases/download/v1.12.218/babashka-1.12.218-linux-amd64.tar.gz"
          tar -xvzf bb.tar.gz
          chmod +x bb
      - name: npm deps
        if: env.DEPLOY == 'true'
        shell: bash
        run: |
          npm ci
      - name: Build server jar
        if: env.DEPLOY == 'true'
        shell: bash
        run: |
          cat >common-resources/common/banner.txt <<EOF
          Build for $GITHUB_REF_NAME @ $GITHUB_SHA
          $(date -Iseconds)
          EOF
          echo '================================================================'
          cat common-resources/common/banner.txt
          echo '================================================================'
          ./bb clojure -M -e '(user/build-uberjar-and-exit "dist.jar")'
      - name: Upload artifact
        if: env.DEPLOY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: server-jar
          path: dist.jar
      - name: Set up heroku credentials
        if: env.DEPLOY == 'true'
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_EMAIL: ${{ secrets.HEROKU_EMAIL }}
        run: |
          cat > ~/.netrc <<EOF
            machine api.heroku.com
              login $HEROKU_EMAIL
              password $HEROKU_API_KEY
            machine git.heroku.com
              login $HEROKU_EMAIL
              password $HEROKU_API_KEY
          EOF
      - name: install heroku jvm deployer
        if: env.DEPLOY == 'true'
        shell: bash
        run: |
          curl -L -o jvm-deployer.jar "https://github.com/heroku/heroku-jvm-application-deployer/releases/download/v4.0.13/heroku-jvm-application-deployer-4.0.13.jar"
      - name: Heroku deploy
        if: env.DEPLOY == 'true'
        shell: bash
        run: |
          java -jar jvm-deployer.jar --app=jetiluastaging dist.jar
